server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: room-reservation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    write:
      # Amounts are scale-2 BigDecimals; never let them render as 2.4E+2 (ADR-0016).
      write-bigdecimal-as-plain: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      # Topics are created by infra/kafka-init, never by the application (contracts/events.md).
      auto-create: false
    consumer:
      # Consumer group = service name (events.md); also the inbox's consumer name.
      group-id: ${spring.application.name}
      # A new group starts from the oldest record: a payment published before the first start must not be skipped.
      auto-offset-reset: earliest
    listener:
      # One consumer thread per partition (3, infra/kafka/create-topics.sh). Ack mode, deserializers, retries and
      # the DLT come from platform/kafka-starter (ADR-0008).
      concurrency: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: the `iss` every token must carry. Keycloak mints it from KC_HOSTNAME, i.e. the host URL,
          # whichever network path the token was requested through (infra/README.md "Keycloak hostname / issuer").
          # jwk-set-uri: where signing keys are fetched. Setting it means Boot builds the decoder from the key set
          # and never calls OIDC discovery; the issuer is still validated. Default = IDE run on the host; the
          # `local` profile (inside compose) overrides only jwk-set-uri to the compose-internal Keycloak URL.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/marvel}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/marvel/protocol/openid-connect/certs}

reservation:
  id:
    # Reservation ids are 8 chars from a 32-symbol alphabet; a collision is rare but possible (contracts/identifiers.md).
    max-attempts: 5
  payment-service-unavailable:
    # Retry-After on 503 PAYMENT_SERVICE_UNAVAILABLE (rest-api.md); a bit longer than the circuit needs to probe again.
    retry-after: 5s
  auto-cancel:
    # ADR-0010. Cancels BANK_TRANSFER reservations still PENDING_PAYMENT at their payment deadline. Safe with any number
    # of instances (each row is claimed with FOR UPDATE SKIP LOCKED); off in the test profile, tests switch it on.
    enabled: ${RESERVATION_AUTO_CANCEL_ENABLED:true}
    interval: ${RESERVATION_AUTO_CANCEL_INTERVAL:PT60S}   # pause between the end of one run and the start of the next
    initial-delay: PT30S
    batch-size: 100   # rows read per page; each row is still cancelled in its own transaction

credit-card:
  client:
    # Spec base path included (src/main/resources/openapi/credit-card-payment-api.yaml, servers.url).
    base-url: ${CREDIT_CARD_BASE_URL:http://localhost:9090/credit-card-payment-api}
    # ADR-0011. Enforced by the HTTP client; the call is blocking, so no Resilience4j TimeLimiter.
    connect-timeout: 1s
    read-timeout: 2s

# ADR-0011 resilience policy for the credit-card status call. Retry is the outer decorator, so each attempt counts in
# the circuit breaker. 404 is not an exception here (the gateway turns it into NOT_FOUND); any other 4xx is never
# retried and never opens the circuit, because it means our request was wrong, not that the service is unhealthy.
resilience4j:
  retry:
    instances:
      creditCardPayment:
        max-attempts: 3            # 1 call + 2 retries
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException   # connect failure, read timeout
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      creditCardPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        # Explicit: Resilience4j's default (100) would exceed the window and delay opening.
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
        register-health-indicator: true
        # An open circuit reports CIRCUIT_OPEN, not DOWN: the payment service being away must not take this service
        # out of rotation. It is also not part of the liveness/readiness groups the orchestrator probes.
        allow-health-indicator-to-fail: false

marvel:
  security:
    # platform/security-starter: the contract's public paths are built in; this service adds its own.
    additional-public-paths: /reference-data
    # Browser origins allowed to call this API cross-origin (the unified Swagger UI in infra/). Empty = no CORS.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        # metrics: a local look at any meter, e.g. /actuator/metrics/debezium.slot.lag.bytes. Meters are pushed over
        # OTLP to otel-lgtm (ADR-0013), so there is no Prometheus scrape endpoint.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # ADR-0013: not ready without its database or its broker (kafka: platform/kafka-starter). The credit-card
          # circuit breaker is deliberately not here (see resilience4j above).
          include: readinessState,db,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
  # ADR-0013. Default = IDE run on the host, where otel-lgtm's OTLP port is published; `local` points at the compose
  # hostname. Boot names the service (service.name) after spring.application.name.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  metrics:
    distribution:
      # Histogram buckets, so Grafana can compute p95 latency per endpoint.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/reservation}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys over the compose network; `iss` still has to be the host URL above (it is what Keycloak mints).
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/marvel/protocol/openid-connect/certs}

marvel:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088}

credit-card:
  client:
    base-url: ${CREDIT_CARD_BASE_URL:http://credit-card-payment-service:9090/credit-card-payment-api}

logging:
  structured:
    format:
      console: ecs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/metrics
        # Boot's default is 1 minute; 10 s keeps the demo dashboard lively.
        step: 10s
  tracing:
    sampling:
      # Every request traced locally, so any saga can be found in Tempo (Boot's default samples 10 %).
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    # Nothing listens here: a test context without the Kafka test container must never reach a developer's
    # compose broker on localhost:9094. The Kafka integration test's @ServiceConnection overrides this.
    bootstrap-servers: localhost:1
    listener:
      # Only the Kafka integration tests start listeners (and bring a broker); other contexts never connect.
      auto-startup: false

reservation:
  auto-cancel:
    # A context-loading or Kafka test must never race a live scheduler; tests that exercise auto-cancel enable
    # this explicitly and inject their own Clock instead of waiting on a real fixedDelay.
    enabled: false

marvel:
  kafka:
    retry:
      # Same number of attempts as production, millisecond waits so retry tests stay fast.
      initial-interval: 10ms
      max-interval: 40ms

management:
  # Tests never export telemetry, whether or not a developer's otel-lgtm is listening on localhost:4318. Only the
  # OTLP export is off: tracing itself stays on (management.tracing.export.enabled=false would make the tracer a
  # no-op), so outbox rows still get a traceparent in tests.
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

---
spring:
  config:
    activate:
      # Test contexts without a broker (bootstrap localhost:1 above), where kafka would always be DOWN. The Kafka
      # integration tests add the `with-broker` profile, keep the full readiness group and check it.
      on-profile: test & !with-broker

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
