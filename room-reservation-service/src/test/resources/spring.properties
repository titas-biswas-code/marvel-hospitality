# Spring Framework 7 pauses a cached test context when another one takes over and restarts it (Lifecycle.start())
# when it is used again. A restart starts every Kafka listener container, whatever its auto-startup setting, so a
# context meant to run without listeners would suddenly consume. Contexts here are few and share one set of
# containers, so pausing saves little; never pause.
spring.test.context.cache.pause=never
