plugins {
    // Downloads the Java 25 toolchain when the host JDK is older.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'bank-transfer-payment-service'

// Shared platform libraries, built from source (ADR-0001): `com.marvel.hospitality:<artifact>` resolves to ../platform.
includeBuild('../platform')
