server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: bank-transfer-payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    write:
      # Amounts are scale-2 BigDecimals; never let them render as 1.2E+2 (ADR-0016). This also shapes the outbox
      # payload, and so the bank-transfer-payment-update value on the wire.
      write-bigdecimal-as-plain: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      # Topics are created by infra/kafka-init, never by the application (contracts/events.md).
      auto-create: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: the `iss` every token must carry. Keycloak mints it from KC_HOSTNAME, i.e. the host URL,
          # whichever network path the token was requested through (infra/README.md "Keycloak hostname / issuer").
          # jwk-set-uri: where signing keys are fetched. Setting it means Boot builds the decoder from the key set
          # and never calls OIDC discovery; the issuer is still validated. Default = IDE run on the host; the
          # `local` profile (inside compose) overrides only jwk-set-uri to the compose-internal Keycloak URL.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/marvel}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/marvel/protocol/openid-connect/certs}

marvel:
  security:
    # Browser origins allowed to call this API cross-origin (the unified Swagger UI in infra/). Empty = no CORS.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/payment}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys over the compose network; `iss` still has to be the host URL above (it is what Keycloak mints).
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/marvel/protocol/openid-connect/certs}

marvel:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088}

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: test
