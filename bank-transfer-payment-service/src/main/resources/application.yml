server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: bank-transfer-payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    write:
      # Amounts are scale-2 BigDecimals; never let them render as 1.2E+2 (ADR-0016). This also shapes the outbox
      # payload, and so the bank-transfer-payment-update value on the wire.
      write-bigdecimal-as-plain: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      # Topics are created by infra/kafka-init, never by the application (contracts/events.md).
      auto-create: false
    consumer:
      # Consumer group = service name (events.md); also the inbox's consumer name.
      group-id: ${spring.application.name}
      # A new group starts from the oldest record: a refund request published before the first start must not be
      # skipped.
      auto-offset-reset: earliest
    listener:
      # One consumer thread per partition (3, infra/kafka/create-topics.sh). Ack mode, deserializers, retries and
      # the DLT come from platform/kafka-starter (ADR-0008).
      concurrency: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: the `iss` every token must carry. Keycloak mints it from KC_HOSTNAME, i.e. the host URL,
          # whichever network path the token was requested through (infra/README.md "Keycloak hostname / issuer").
          # jwk-set-uri: where signing keys are fetched. Setting it means Boot builds the decoder from the key set
          # and never calls OIDC discovery; the issuer is still validated. Default = IDE run on the host; the
          # `local` profile (inside compose) overrides only jwk-set-uri to the compose-internal Keycloak URL.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/marvel}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/marvel/protocol/openid-connect/certs}

marvel:
  security:
    # Browser origins allowed to call this API cross-origin (the unified Swagger UI in infra/). Empty = no CORS.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        # metrics: a local look at any meter, e.g. /actuator/metrics/debezium.slot.lag.bytes. Meters are pushed over
        # OTLP to otel-lgtm (ADR-0013), so there is no Prometheus scrape endpoint.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # ADR-0013: not ready without its database or its broker (kafka: platform/kafka-starter).
          include: readinessState,db,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # ADR-0013. Default = IDE run on the host, where otel-lgtm's OTLP port is published; `local` points at the compose
  # hostname. Boot names the service (service.name) after spring.application.name.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  metrics:
    distribution:
      # Histogram buckets, so Grafana can compute p95 latency per endpoint.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/payment}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys over the compose network; `iss` still has to be the host URL above (it is what Keycloak mints).
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/marvel/protocol/openid-connect/certs}

marvel:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088}

logging:
  structured:
    format:
      console: ecs

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://otel-lgtm:4318}/v1/metrics
        # Boot's default is 1 minute; 10 s keeps the demo dashboard lively.
        step: 10s
  tracing:
    sampling:
      # Every request traced locally, so any saga can be found in Tempo (Boot's default samples 10 %).
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    # Nothing listens here: a test context without the Kafka test container must never reach a developer's
    # compose broker on localhost:9094. The Kafka integration test's @ServiceConnection overrides this.
    bootstrap-servers: localhost:1
    listener:
      # Only the Kafka integration tests start listeners (and bring a broker); other contexts never connect.
      auto-startup: false

marvel:
  kafka:
    retry:
      # Same number of attempts as production, millisecond waits so retry tests stay fast.
      initial-interval: 10ms
      max-interval: 40ms

management:
  # Tests never export telemetry, whether or not a developer's otel-lgtm is listening on localhost:4318. Only the
  # OTLP export is off: tracing itself stays on (management.tracing.export.enabled=false would make the tracer a
  # no-op), so outbox rows still get a traceparent in tests.
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

---
spring:
  config:
    activate:
      # Test contexts without a broker (bootstrap localhost:1 above), where kafka would always be DOWN. The Kafka
      # integration tests add the `with-broker` profile, keep the full readiness group and check it.
      on-profile: test & !with-broker

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
