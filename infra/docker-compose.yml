# Local environment for marvel-hospitality. Image versions: docs/versions.md. Ports: infra/README.md.
#   docker compose -f infra/docker-compose.yml up -d --wait                  # infrastructure only
#   docker compose -f infra/docker-compose.yml --profile apps up -d --wait   # + application services (added from PR-01 on)
name: marvel-hospitality

services:

  postgres:
    image: postgres:17.11-alpine
    command:
      - postgres
      # Logical decoding for Debezium (ADR-0007). max_slot_wal_keep_size caps WAL retained by a stalled slot.
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation && pg_isready -U postgres -d payment && pg_isready -U postgres -d notification"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: compose network (kafka:9092). EXTERNAL: host tools and IDE runs (localhost:9094).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      connect:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: marvel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: marvel-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # Imports infra/keycloak/realm/marvel-realm.json, but only when the realm does not exist yet
    # (i.e. on an empty keycloak-data volume; `make reset` wipes it). See infra/keycloak/README.md.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Issuer = the URL the host uses, so tokens minted from localhost validate inside compose too
      # (services fetch JWKS from http://keycloak:8080 but check iss against this URL; infra/README.md).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Embedded dev database in the keycloak-data volume; explicit so `kc.sh export` (export.sh) uses the same one.
      KC_DB: dev-file
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      # Directory mount (not a single file): survives export.sh rewriting the file and never makes Docker
      # create a directory in place of a missing file.
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl in the image: raw HTTP over bash /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Application services join here under `profiles: [apps]` from PR-01 onwards.

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:
