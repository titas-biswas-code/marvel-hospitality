plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.marvel.hospitality'
version = '0.0.1-SNAPSHOT'
description = 'Stub implementing docs/contracts/credit-card-payment-api.yaml (in-memory)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '3.1.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Serves the corrected spec verbatim at build time (api/OpenApiSpecController reads it from the classpath);
// never commit a copy of docs/contracts/credit-card-payment-api.yaml into this service.
processResources {
    from('../docs/contracts/credit-card-payment-api.yaml') {
        into 'static'
    }
}

// Only the executable jar is needed (Dockerfile copies build/libs/*.jar).
tasks.named('jar') {
    enabled = false
}
