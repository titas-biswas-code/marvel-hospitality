server:
  port: ${SERVER_PORT:9090}
  shutdown: graceful

spring:
  application:
    name: credit-card-payment-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: test
