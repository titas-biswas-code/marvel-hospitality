description = 'Kafka consumption policy (ADR-0008): manual ack, ErrorHandlingDeserializer, blocking exponential ' +
        'retries, dead-letter topic <topic>.DLT, JSON-to-record conversion, kafka.dlt.messages metric'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-kafka'
    api 'org.springframework.boot:spring-boot-starter-jackson'
    // @Valid on listener payloads: a validation failure is a contract violation and goes straight to the DLT.
    api 'org.springframework.boot:spring-boot-starter-validation'
    // kafka.dlt.messages{topic} (ADR-0008, ADR-0013); recorded only when the service has a MeterRegistry.
    api 'io.micrometer:micrometer-core'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.awaitility:awaitility'
    // The JVM-wide Kafka container every service test already uses (outbox starter test fixtures).
    testImplementation testFixtures(project(':marvel-outbox-spring-boot-starter'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
